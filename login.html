<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; display: flex; height: 100vh; justify-content: center; align-items: center; flex-direction: column; }
        .card { background: white; padding: 2rem; border-radius: 10px; width: 350px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background: #4361ee; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .link { display: block; margin-top: 15px; color: #666; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>👋 Staff Login</h2>
        <p>Field Staff & Office Team</p>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="btn" onclick="login()">Login</button>
    </div>
    <a href="admin.html" class="link">Go to Admin Login</a>

    <script>
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.querySelector('.btn');

            if(!user || !pass) return alert("Enter details");
            btn.textContent = "Checking...";

            try {
                const res = await fetch('http://localhost:5000/api/employee-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('empName', data.name);
                    localStorage.setItem('empRole', data.role); // Role Save kiya
                    localStorage.setItem('isEmpLoggedIn', 'true');

                    // YAHAN HAI MAGIC LOGIC
                    if (data.role === 'filler') {
                        window.location.href = "filler_panel.html"; // Filler ke liye alag page
                    } else {
                        window.location.href = "employee_panel.html"; // Field staff ke liye alag page
                    }
                } else {
                    alert("❌ Wrong ID/Password");
                    btn.textContent = "Login";
                }
            } catch (err) { alert("Server Error"); btn.textContent = "Login"; }
        }
    </script>
</body>
</html>
