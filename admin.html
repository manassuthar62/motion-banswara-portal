<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Motion Banswara</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Yantramanav:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column;
        }

        /* --- HEADER STYLE (Updated) --- */
        .welcome-header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeInDown 1s ease-out;
        }
        .welcome-header h1 {
            font-family: 'Yantramanav', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0;
            line-height: 1.1;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff 0%, #ffd700 50%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CARD STYLE */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem; border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center;
            backdrop-filter: blur(10px);
        }
        h2 { color: #333; margin-bottom: 1.5rem; font-size: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; color: #555; font-size: 0.9rem; font-weight: 600; }
        input {
            width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; outline: none; transition: 0.3s; box-sizing: border-box;
        }
        input:focus { border-color: #1e3c72; box-shadow: 0 0 8px rgba(30, 60, 114, 0.2); }
        
        .btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 1rem; transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(30, 60, 114, 0.4); }
        .links { margin-top: 1rem; font-size: 0.9rem; }
        .links a { color: #1e3c72; text-decoration: none; cursor: pointer; font-weight: 500; }
        .hidden { display: none; }
        .error { color: red; font-size: 0.85rem; margin-top: 0.5rem; display: none; background: #ffe6e6; padding: 5px; border-radius: 4px; }

        /* Bottom Links Section */
        .bottom-links { 
            margin-top: 2rem; 
            text-align: center; 
            width: 100%; 
            max-width: 400px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .link-btn { 
            display: block; 
            color: rgba(255,255,255,0.9); 
            text-decoration: none; 
            font-size: 0.95rem; 
            padding: 10px 20px; 
            border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.3);
            transition: 0.3s; 
            background: rgba(255,255,255,0.1);
            font-weight: 500;
        }
        .link-btn:hover { 
            background: white; 
            color: #1e3c72; 
            transform: translateX(5px); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        /* Colored Borders for Identification */
        .field-staff { border-left: 5px solid #2ed573; }
        .form-filler { border-left: 5px solid #ffa502; }
        .observer { border-left: 5px solid #11998e; }
    </style>
</head>
<body>

    <div class="welcome-header">
        <!-- <h1>MOTION EDUCATION <br> BANSWARA</h1> -->
    </div>

    <div class="login-card">
        <div id="loginForm">
            <h2>🔐 Admin Login</h2>
            <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="admin"></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Password"></div>
            <div id="loginError" class="error">Invalid Credentials!</div>
            <button class="btn" onclick="checkLogin()">Secure Login</button>
            <div class="links"><a onclick="showForgot()">Forgot Password?</a></div>
        </div>

        <div id="forgotForm" class="hidden">
            <h2>🔑 Reset Password</h2>
            <div class="form-group"><label>Secret Code</label><input type="password" id="secretKey" placeholder="Ex: motion2025"></div>
            <div class="form-group"><label>New Password</label><input type="text" id="newPassword" placeholder="New Password"></div>
            <div id="resetError" class="error">Invalid Secret Code!</div>
            <button class="btn" onclick="resetPassword()">Reset Password</button>
            <div class="links"><a onclick="showLogin()">Back to Login</a></div>
        </div>
    </div>

    <div class="bottom-links">
        <a href="employee_panel.html" class="link-btn field-staff">👋 Field Staff Login (Data Entry)</a>
        <a href="login.html" class="link-btn form-filler">💻 Form Filling Team Login</a>
        <a href="viewer_login.html" class="link-btn observer">👁️ Observer Login (View Only)</a>
    </div>

    <script>
        const DEFAULT_PASS = "admin123"; 
        const SECRET_KEY = "motion2025"; 

        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const savedPass = localStorage.getItem('adminPass') || DEFAULT_PASS;

            if (user === "admin" && pass === savedPass) {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = "dashboard.html"; 
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function resetPassword() {
            const key = document.getElementById('secretKey').value;
            const newPass = document.getElementById('newPassword').value;
            if (key === SECRET_KEY) {
                localStorage.setItem('adminPass', newPass);
                alert("✅ Password Changed Successfully!");
                showLogin();
            } else {
                document.getElementById('resetError').style.display = 'block';
            }
        }

        function showForgot() { document.getElementById('loginForm').classList.add('hidden'); document.getElementById('forgotForm').classList.remove('hidden'); }
        function showLogin() { document.getElementById('forgotForm').classList.add('hidden'); document.getElementById('loginForm').classList.remove('hidden'); }
        
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                if(!document.getElementById('loginForm').classList.contains('hidden')) checkLogin();
            }
        });
    </script>
</body>
</html>
